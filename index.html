<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đảo Đèn Lồng — Đêm 1: Đảo Bến</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #070b16;
        color: #f6e7cb;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        user-select: none;
      }
      #hud {
        position: fixed;
        top: 16px;
        left: 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 12px 16px;
        min-width: 245px;
        border-radius: 12px;
        background: rgba(11, 13, 28, 0.78);
        border: 1px solid rgba(255, 190, 92, 0.32);
        backdrop-filter: blur(6px);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      }
      .hud-title {
        font-weight: 700;
        font-size: 15px;
        color: #ffcf75;
        letter-spacing: 0.02em;
      }
      .hud-row {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        gap: 16px;
      }
      .hud-label {
        color: #b7bed8;
      }
      .hud-val {
        font-weight: 600;
        color: #fff3db;
      }
      #controls {
        position: fixed;
        bottom: 16px;
        left: 16px;
        padding: 10px 14px;
        border-radius: 10px;
        background: rgba(11, 13, 28, 0.72);
        border: 1px solid rgba(255, 190, 92, 0.2);
        font-size: 12px;
        line-height: 1.5;
        color: #d6dcf0;
      }
      #top-right {
        position: fixed;
        top: 16px;
        right: 16px;
        display: flex;
        gap: 8px;
      }
      button {
        cursor: pointer;
        border: 1px solid rgba(255, 196, 107, 0.45);
        background: rgba(24, 28, 52, 0.85);
        color: #ffe3ae;
        padding: 8px 14px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
      }
      button:hover {
        background: rgba(255, 178, 71, 0.25);
      }
      #status-banner {
        position: fixed;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        padding: 8px 16px;
        border-radius: 999px;
        background: rgba(255, 178, 71, 0.2);
        border: 1px solid rgba(255, 196, 107, 0.45);
        color: #ffe5b4;
        font-size: 13px;
        opacity: 0;
        transition: opacity 0.25s ease;
        pointer-events: none;
      }
      #status-banner.visible {
        opacity: 1;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(6, 8, 18, 0.74);
        backdrop-filter: blur(5px);
        z-index: 10;
      }
      #overlay.open {
        display: flex;
      }
      .modal {
        width: min(400px, 90vw);
        padding: 24px 28px;
        border-radius: 16px;
        background: #11152c;
        border: 1px solid rgba(255, 190, 92, 0.45);
        text-align: center;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
      }
      .modal h2 {
        margin: 0 0 8px;
        font-size: 24px;
        color: #ffd37d;
      }
      .modal p {
        margin: 8px 0 18px;
        color: #d6dcf0;
        line-height: 1.5;
        font-size: 14px;
      }
      .modal-btn {
        background: #e89b32;
        color: #120d05;
        border: none;
        padding: 10px 22px;
        font-size: 15px;
      }
      .modal-btn:hover {
        background: #ffb44c;
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <div class="hud-title">Đảo Đèn Lồng · Đêm 1: Đảo Bến</div>
      <div class="hud-row">
        <span class="hud-label">Ngọn lửa (Máu)</span>
        <span class="hud-val" id="hud-flames">♥ ♥ ♥</span>
      </div>
      <div class="hud-row">
        <span class="hud-label">Đom đóm mang</span>
        <span class="hud-val" id="hud-carried">0 / 5</span>
      </div>
      <div class="hud-row">
        <span class="hud-label">Đèn Lồng Lớn</span>
        <span class="hud-val" id="hud-lanterns">0 / 5</span>
      </div>
      <div class="hud-row">
        <span class="hud-label">Thời gian đêm</span>
        <span class="hud-val" id="hud-time">05:00</span>
      </div>
      <div class="hud-row">
        <span class="hud-label">Điểm số</span>
        <span class="hud-val" id="hud-score">0</span>
      </div>
      <div class="hud-row">
        <span class="hud-label">Tỏa sáng (Pulse)</span>
        <span class="hud-val" id="hud-pulse">Cần 1 đom đóm</span>
      </div>
    </div>

    <div id="top-right">
      <button id="btn-mute" type="button">Âm thanh: Bật (M)</button>
      <button id="btn-restart-hud" type="button">Chơi lại</button>
    </div>

    <div id="status-banner"></div>

    <div id="controls">
      <strong>Điều khiển:</strong> WASD / Mũi tên: Di chuyển · Kéo chuột hoặc Q/C: Xoay camera ·
      Space: Nhảy · E/F: Nạp đèn · R/Shift: Tỏa sáng · M: Âm thanh
    </div>

    <div id="overlay">
      <div class="modal">
        <h2 id="modal-title">Chiến thắng!</h2>
        <p id="modal-body"></p>
        <button class="modal-btn" id="btn-play-again" type="button">Chơi lại</button>
      </div>
    </div>

    <script type="module" src="/src/web/main.ts"></script>
  </body>
</html>
