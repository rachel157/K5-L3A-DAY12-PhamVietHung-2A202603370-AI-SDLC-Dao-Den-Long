name: CI

on:
  push:
    branches: [main]
    tags: ["phase-*"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build CLI and Web
        run: npm run build

      - name: Run unit, boundary, and CLI tests
        run: npm test

      - name: Run headless determinism smoke check
        run: |
          out1=$(npm run headless --silent -- --seed 7 --ticks 20)
          out2=$(npm run headless --silent -- --seed 7 --ticks 20)
          echo "$out1"
          test "$out1" = "$out2"
