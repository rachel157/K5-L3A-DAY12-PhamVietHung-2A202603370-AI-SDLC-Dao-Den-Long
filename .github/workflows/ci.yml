name: CI

on:
  push:
    branches: [main]
    tags: ["phase-*"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build CLI and Web
        run: npm run build

      - name: Run unit, boundary, and CLI tests
        run: npm test

      - name: Run headless determinism smoke check across Nights 1-3
        run: |
          for n in 1 2 3; do
            node dist-cli/cli/headless.js --seed 7 --night "$n" --ticks 60 --out "/tmp/n${n}-r1.jsonl"
            node dist-cli/cli/headless.js --seed 7 --night "$n" --ticks 60 --out "/tmp/n${n}-r2.jsonl"
            diff -u "/tmp/n${n}-r1.jsonl" "/tmp/n${n}-r2.jsonl"
            tail -n 1 "/tmp/n${n}-r1.jsonl"
          done
