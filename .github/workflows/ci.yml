name: CI

on:
  push:
    branches: [main]
    tags: ["phase-*"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build CLI and Web
        run: npm run build

      - name: Run unit, boundary, and CLI tests
        run: npm test

      - name: Run headless determinism smoke check
        run: |
          node dist-cli/cli/headless.js --seed 7 --night 1 --ticks 60 --out /tmp/r1.jsonl
          node dist-cli/cli/headless.js --seed 7 --night 1 --ticks 60 --out /tmp/r2.jsonl
          diff -u /tmp/r1.jsonl /tmp/r2.jsonl
          tail -n 1 /tmp/r1.jsonl
